<!doctype html>
<!-- Källan till docs/manual/kort.png, den annoterade bilden i README.
     Sidan laddar det riktiga kortet (custom_components/bussar/www/bussar-card.js) med påhittade
     sensorer och ritar numrerade röda markeringar runt kortets delar. Uppdatera bilden med
     scripts/manual-image när kortet ändras. Bara anonymiserade exempeldata: Ort A–D, linjerna 10–40. -->
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Bussar – annoterat kort</title>
<style>
  :root {
    --primary-color: #03a9f4; --primary-text-color: #212121; --secondary-text-color: #727272;
    --divider-color: rgba(0, 0, 0, .12); --card-background-color: #fff; --text-primary-color: #fff;
    --success-color: #43a047; --error-color: #db4437; --warning-color: #ffa600;
  }
  body { margin: 0; background: #f5f5f5; font-family: Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--primary-text-color); }
  #stage { position: relative; width: 1280px; height: 460px; }
  bussar-card { position: absolute; left: 430px; top: 40px; display: block; width: 420px; }
  .note { position: absolute; width: 340px; font-size: 14px; line-height: 1.35; }
  .note.left { left: 30px; text-align: right; }
  .note.right { left: 910px; }
  .note b { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; margin-right: 6px;
    border-radius: 50%; background: #d32f2f; color: #fff; font-size: 13px; vertical-align: 1px; }
  svg { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
</style>
</head>
<body>
<div id="stage">
  <bussar-card></bussar-card>
  <svg id="marks"></svg>
</div>
<script type="module">
// Fast tidpunkt, så att bilden blir likadan varje gång.
const NOW = Date.parse("2026-10-17T19:43:36+02:00");
Date.now = () => NOW;

const timing = { walk_seconds: 270, run_seconds: 120, window_seconds: 300 };
const sensor = (line, platform, destination, expected, scheduled, following, extra = {}) => ({
  entity_id: `sensor.${line}_lage_${platform.toLowerCase()}_ort_a`,
  state: "0",
  attributes: {
    line, platform, stop_id: "1000", destination, expected, scheduled,
    delay_minutes: Math.round((Date.parse(expected) - Date.parse(scheduled)) / 60000),
    is_realtime: true, following_expected: following, ...timing, ...extra,
  },
});
// Gott om tid och 2 min sen; gå nu och 1 min tidig; spring, enligt tidtabell.
const sensors = [
  sensor("10", "A", "Ort B", "2026-10-17T19:59:29+02:00", "2026-10-17T19:57:29+02:00", "2026-10-17T20:14:47+02:00", { line_color: "#2e7d32" }),
  sensor("20", "B", "Ort C", "2026-10-17T19:51:06+02:00", "2026-10-17T19:52:06+02:00", "2026-10-17T20:06:00+02:00", { line_color: "#757575" }),
  sensor("30", "A", "Ort D", "2026-10-17T19:46:36+02:00", "2026-10-17T19:46:36+02:00", "2026-10-17T20:16:36+02:00", { is_realtime: false }),
];
const hass = {
  states: Object.fromEntries(sensors.map((s) => [s.entity_id, s])),
  config: { time_zone: "Europe/Stockholm" },
  entities: {},
};

await import("../../custom_components/bussar/www/bussar-card.js");
const card = document.querySelector("bussar-card");
card.setConfig({ title: "Bussar", entities: sensors.map((s) => s.entity_id) });
card.hass = hass;
// Ingen nedräkning i bilden.
card.disconnectedCallback();

// [sida, rad, element, väg ut, förklaring]. Raden räknas från 1; 0 är kortet självt.
// Vägen ut ur kortet korsar ingen text, stapel eller bricka: "side" går vågrätt mot förklaringens sida,
// "under" vågrätt längs rutans underkant (mellanrummet mellan textraden och stapeln) och "up" lodrätt.
// Förklaringarna står på varje sida i den ordning strecken lämnar kortet, uppifrån.
const NOTES = [
  ["left", 1, ".dest", "up", "Bussens destination."],
  ["left", 1, ".badge", "side", "Linjen, i linjens färg. Färgen väljs under <i>⋮ → Ändra gångtider och färg</i>. Utan vald färg: temats färg (som linje 30)."],
  ["left", 1, ".bar", "side", "Stapeln töms mot springgränsen. Grön: gott om tid. Gul: nu passar det att gå. Orange: spring."],
  ["left", 2, ".early", "under", "Försening i minuter. <code>-1</code> (grön): en minut tidig. <code>+2</code> (röd): två minuter sen. Ingen siffra: i tid."],
  ["left", 3, ".now", "under", "Bussens avgång som klockslag."],
  ["right", 1, ".live", "up", "Grön, pulserande punkt: tiden är realtid. Utan punkt kommer tiden från tidtabellen, som på linje 30."],
  ["right", 2, ".minutes", "side", "Minuter tills bussen går."],
  ["right", 3, ".next", "side", "Klockslaget för bussen efter."],
  ["right", 0, ".toggle", "side", "Fäller ut en karta med bussarna i realtid."],
];

const root = card.shadowRoot;
// ha-card finns bara i Home Assistant. Här får den samma utseende som där.
root.prepend(Object.assign(document.createElement("style"), {
  textContent: "ha-card { display: block; background: var(--card-background-color); border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.15); overflow: hidden; }",
}));
const rows = [...root.querySelectorAll(".rows > .row")];
const find = (row, sel) => (row === 0 ? root : rows[row - 1]).querySelector(sel);
const textRect = (el, end) => {
  const range = document.createRange();
  range.selectNodeContents(el);
  if (end) range.setEnd(end, end.length);
  return range.getBoundingClientRect();
};
// Rutan runt själva texten, inte runt hela elementet (en textrad kan vara bredare än texten).
const box = (el) => {
  if (el.matches(".bar, .live, .badge")) return el.getBoundingClientRect();
  return textRect(el, el.matches(".now") ? el.firstChild : null);
};
// Vänta en bildruta, så att kortet har fått sin layout.
await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));

// Kortets textrader. En markeringsruta växer inte in i textraden ovanför eller under.
const lines = [...root.querySelectorAll(".title, .dest, .sub, .minutes, .toggle")].map((el) => textRect(el));
const stageEl = document.getElementById("stage");
const stage = stageEl.getBoundingClientRect();
const svg = document.getElementById("marks");
const NS = "http://www.w3.org/2000/svg";
const add = (tag, attrs) => {
  const el = svg.appendChild(document.createElementNS(NS, tag));
  Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
};
const RED = "#d32f2f";
const PAD = 3;
const GAP = 14;
// Där strecken möter förklaringarna, och hur långt utanför kortet de viker av.
const ANCHOR = { left: 380, right: 900 };
const OUT = 12;
const c = root.querySelector("ha-card").getBoundingClientRect();
const cardRect = { left: c.left - stage.left, right: c.right - stage.left, top: c.top - stage.top, bottom: c.bottom - stage.top };

const padY = (r) => {
  const near = lines.filter((l) => l.left < r.right + PAD && l.right > r.left - PAD);
  const above = Math.min(PAD, ...near.filter((l) => l.bottom <= r.top + 2).map((l) => r.top - l.bottom));
  const below = Math.min(PAD, ...near.filter((l) => l.top >= r.bottom - 2).map((l) => l.top - r.bottom));
  return [Math.max(0, above), Math.max(0, below)];
};

const marks = NOTES.map(([side, row, sel, exit, text], i) => {
  const r = box(find(row, sel));
  const [above, below] = padY(r);
  const m = { side, exit, text, n: i + 1, x: r.left - stage.left - PAD, top: r.top - stage.top - above, w: r.width + 2 * PAD, h: r.height + above + below };
  m.y = { side: m.top + m.h / 2, under: m.top + m.h, up: cardRect.top - OUT }[exit];
  return m;
});

// Förklaringarna på varje sida i NOTES ordning, så nära sitt streck som möjligt utan att överlappa varandra.
for (const side of ["left", "right"]) {
  let next = 0;
  for (const m of marks.filter((m) => m.side === side)) {
    const note = document.createElement("div");
    note.className = `note ${side}`;
    note.innerHTML = side === "left" ? `${m.text} <b>${m.n}</b>` : `<b>${m.n}</b>${m.text}`;
    stageEl.append(note);
    const top = Math.max(next, m.y - 11);
    note.style.top = `${top}px`;
    m.ny = top + 11;
    next = top + note.offsetHeight + GAP;
  }
}

for (const m of marks) {
  const anchor = ANCHOR[m.side];
  const cx = m.x + m.w / 2;
  let points;
  if (m.exit === "up") {
    points = [[cx, m.top], [cx, m.ny], [anchor, m.ny]];
  } else {
    const fromX = m.exit === "under" ? cx : m.side === "left" ? m.x : m.x + m.w;
    const outX = m.side === "left" ? cardRect.left - OUT : cardRect.right + OUT;
    points = [[fromX, m.y], [outX, m.y], [anchor, m.ny]];
  }
  add("polyline", { points: points.join(" "), fill: "none", stroke: RED, "stroke-width": 1.2, opacity: 0.85 });
  add("circle", { cx: anchor, cy: m.ny, r: 3, fill: RED });
  add("rect", { x: m.x, y: m.top, width: m.w, height: m.h, rx: Math.min(8, m.h / 2), fill: "none", stroke: RED, "stroke-width": 2 });
}
</script>
</body>
</html>
