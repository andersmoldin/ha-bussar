<!doctype html>
<html lang="sv">
<!-- Förhandsvisning av Bussar-kortet med påhittade sensorer, för visuell kontroll.
     Kör: python3 -m http.server 8765  och öppna  http://localhost:8765/tests/js/preview.html?theme=dark -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bussar-kort – förhandsvisning</title>
<style>
  :root { --primary-color: #03a9f4; --primary-text-color: #212121; --secondary-text-color: #727272;
    --divider-color: rgba(0,0,0,.12); --card-background-color: #fff; --success-color: #43a047;
    --warning-color: #ffa600; --error-color: #db4437; --text-primary-color: #fff; }
  html[data-theme="dark"] { --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b;
    --divider-color: rgba(225,225,225,.12); --card-background-color: #1c1c1c; }
  body { margin: 0; padding: 16px; font-family: Roboto, -apple-system, sans-serif; color: var(--primary-text-color);
    background: var(--card-background-color); filter: brightness(1); }
  html[data-theme="dark"] body { background: #111; }
  ha-card { display: block; max-width: 420px; margin: 0 auto; border-radius: 12px; border: 1px solid var(--divider-color);
    background: var(--card-background-color); overflow: hidden; }
</style>
</head>
<body>
<bussar-card></bussar-card>
<script type="module">
  import "../../custom_components/bussar/www/bussar-card.js";
  document.documentElement.dataset.theme = new URLSearchParams(location.search).get("theme") || "light";
  const iso = (s) => new Date(Date.now() + s * 1000).toISOString();
  const sensor = (line, destination, left, following, extra = {}) => ({
    state: String(Math.floor(left / 60)),
    attributes: { line, destination, expected: iso(left), following_expected: following === null ? null : iso(following),
      delay_minutes: 0, is_realtime: false, walk_seconds: 270, run_seconds: 120, window_seconds: 300, ...extra },
  });
  const hass = {
    config: { time_zone: "Europe/Stockholm" },
    states: {
      "sensor.linje_3": sensor("3", "Centrum", 1000, 1900, { delay_minutes: 2, is_realtime: true }),
      "sensor.linje_11": sensor("11", "Centralstationen", 500, 1400, { is_realtime: true, delay_minutes: -1 }),
      "sensor.linje_7": sensor("7", "Centrum", 200, 1100),
      "sensor.linje_107": sensor("107", "Ort", 0, null, { expected: null }),
    },
  };
  const card = document.querySelector("bussar-card");
  card.setConfig({ title: "Bussar", entities: Object.keys(hass.states) });
  card.hass = hass;
</script>
</body>
</html>
